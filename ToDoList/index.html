<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Todo List</h1>

    <form id="todo-form">
        <input id="todo-input" type="text" placeholder="할 일">
        <button type="submit">추가</button>
    </form>
    <div id="filter-buttons">
        <button type="button" class="filter-btn active" data-filter="all">전체</button>
        <button type="button" class="filter-btn" data-filter="active">진행중</button>
        <button type="button" class="filter-btn" data-filter="completed">완료</button>
    </div>

    <ul id="todo-list"></ul>
    <p id="empty-message">할 일이 없습니다.</p>
    <p id="todo-count">0개 남음</p>
    <script src="js/todo.js"></script>
</body>
</html>
